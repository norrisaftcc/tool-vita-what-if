name: Bug Report
description: Report a bug or unexpected behavior in the tool-vita-what-if project
title: "[BUG] "
labels: ["bug", "needs-review"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: checkboxes
    id: terms
    attributes:
      label: Prerequisites
      description: Please confirm you have completed these steps before submitting this bug report.
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported before
          required: true
        - label: I have read the project documentation and confirmed this is unexpected behavior
          required: true
        - label: I can reproduce this issue consistently
          required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How critical is this bug to your workflow?
      options:
        - P3 - Low (minor inconvenience, workaround available)
        - P2 - Medium (affects functionality but not blocking)
        - P1 - High (blocking important functionality)
        - P0 - Critical (system unusable, data loss, security issue)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: What environment are you using? (OS, Node version, browser, etc.)
      placeholder: "macOS 14.0, Node 18.17.0, Chrome 116"
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: What is happening that you believe is incorrect?
      placeholder: Describe the current behavior in detail
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Describe the expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Please provide detailed steps to reproduce this bug
      placeholder: |
        1. Go to...
        2. Click on...
        3. Enter...
        4. See error
    validations:
      required: true

  - type: textarea
    id: code-sample
    attributes:
      label: Code Sample (if applicable)
      description: If relevant, please provide a minimal code sample that demonstrates the issue
      render: typescript
      placeholder: |
        // Your code sample here

  - type: textarea
    id: logs
    attributes:
      label: Error Messages/Logs
      description: Please include any relevant error messages, stack traces, or log output
      render: shell
      placeholder: Paste error messages or logs here

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, related issues, etc.)

  - type: input
    id: impact
    attributes:
      label: Business/User Impact
      description: How does this bug affect users or business operations?
      placeholder: "Prevents users from completing checkout process"
    validations:
      required: true